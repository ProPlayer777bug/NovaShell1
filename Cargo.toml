[package]
name = "novashell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "NovaShell - an original console-style desktop shell for Ubuntu (GNOME/Wayland friendly)"
license = "MIT"
authors = ["NovaShell contributors"]

[[bin]]
name = "novashell"
path = "src/main.rs"

[lib]
name = "novashell"
path = "src/lib.rs"

[dependencies]
# Serialization for config + UI bridge messages
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XDG path resolution (~/.config etc)
dirs = "5"

# Logging + timestamps
log = "0.4"
chrono = "0.4"

# Idiomatic error handling
anyhow = "1"

# Linux-only GUI / input core (logic modules stay cross-platform for tests)
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.10", features = ["v4_14"] }
webkit6 = "0.5"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"